name: Trading Strategy Scanner

on:
  schedule:
    - cron: '*/5 * * * *'   # Every 5 minutes, 24/7
  workflow_dispatch:          # Manual trigger from GitHub UI
  push:
    branches: [main]

permissions:
  contents: write             # Needed to commit state.json back

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8        # Kill if it hangs

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPACA_API_KEY:          ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:       ${{ secrets.ALPACA_SECRET_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python scanner_once.py

      - name: Save alert state back to repo
        run: |
          git config user.name  "Trading Scanner Bot"
          git config user.email "scanner-bot@noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update scanner state [skip ci]"
          git push
