name: Dynamic Stock Selector

on:
  schedule:
    - cron: '0 22 */10 * *'   # Every 10 days at 10 PM UTC
  workflow_dispatch:            # Manual trigger anytime

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Stock Selector
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd MomentumRSI
          python stock_selector.py

      - name: Commit updated stock list
        run: |
          git config user.name  "Stock Selector Bot"
          git config user.email "bot@trading-strategy"
          git add MomentumRSI/mrsi_config.py
          git diff --cached --quiet || git commit -m "chore: auto-update stock list [skip ci]"
          git push
